name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Run npm audit
        run: cd apps/web && npm audit --audit-level=high

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultnary_test
          POSTGRES_USER: vaultnary
          POSTGRES_PASSWORD: vaultnary_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultnary -d vaultnary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vaultnary:vaultnary_test_only@localhost:5432/vaultnary_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test --all

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Typecheck
        run: cd apps/web && npm run typecheck

      - name: Build
        run: cd apps/web && npm run build
