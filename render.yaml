services:
  - type: web
    name: vaultnary-api
    runtime: rust
    rootDir: .
    buildCommand: cargo build --release --bin api
    startCommand: ./target/release/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaultnary-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Vaultnary <noreply@vaultnary.app>"

databases:
  - name: vaultnary-db
    databaseName: vaultnary
    user: vaultnary
    plan: free
