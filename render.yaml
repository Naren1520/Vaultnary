services:
  - type: web
    name: vaultnary-api
    runtime: rust
    rootDir: .
    buildCommand: cargo build --release --bin api
    startCommand: ./target/release/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaultnary-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vaultnary-redis
          type: redis
          property: connectionString
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@vaultnary.app

databases:
  - name: vaultnary-db
    databaseName: vaultnary
    user: vaultnary
    plan: free

  - name: vaultnary-redis
    plan: free
    type: redis
